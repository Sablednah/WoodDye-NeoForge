plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against, on every line including this one.
// All lines share a mod version, and two files both called wooddye-2.1.0.jar are indistinguishable
// in a mods folder or on a releases page. The mod's own version (in mods.toml) stays a plain
// ${mod_version}.
//
// The jar to ship is build/libs (reobfuscated to SRG names, which is what Forge 1.20.1 runs);
// build/devlibs holds the unobfuscated jar and does not load outside a dev environment.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")            // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Create, for the optional contraption hook (compile-time only; see dependencies).
    maven { url = 'https://maven.createmod.net' }
    // The Mixin annotation processor, which writes the refmap (see legacyForge.mixin below).
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    // JEI, for the optional plugin (compile-time only).
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 ships Java 17 to end users, so Forge mods target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Mixins on 1.20.1 need a refmap, because the shipped jar runs against obfuscated names: the
    // plugin runs the Mixin annotation processor to write one, and wires the dev runs.
    mixin {
        add sourceSets.main, 'wooddye.refmap.json'
        config 'wooddye.mixins.json'
    }
    version = project.forge_version

    // Parchment gives human-readable parameter names/javadocs. Optional.
    // Enabled only when both properties are set in gradle.properties (some MC
    // versions may not have Parchment mappings published yet).
    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    // Access Transformers are auto-detected from META-INF/accesstransformer.cfg

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // A dev client that joins the dev server by itself, as the sibling mods have: no account
        // needed (the dev server is online-mode=false). This is the client a script can drive
        // -- on the Vivo test machine, to photograph /wooddye showcase.
        clientBuddy {
            client()
            programArguments.addAll '--username', 'TestBuddy',
                    '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            // Own game dir: sharing run/ with a live dev server means both fight over
            // logs/latest.log.
            gameDirectory = file('runBuddy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The dev-only "Warnings while loading mods" page waits for a click, which an
            // unattended client never gives it; every mod still declaring logoFile triggers it.
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' declares runtime-only test dependencies that are NOT published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create is optional at runtime: compat/CreateFireproof is only loaded when the mod list has
    // it. It is needed here only so that class compiles. To test with it, drop Create, Flywheel
    // and Ponder into run/mods.
    // On the legacy plugin a mod jar must come in through modCompileOnly, which remaps it from
    // production names to the names this build uses.
    modCompileOnly("${create_compile}") { transitive = false }
    // JEI the same way: compat/JeiFireproof is found by JEI's annotation scan.
    modCompileOnly("${jei_compile}") { transitive = false }
    // Runs at compile time to write the refmap the legacy mixin DSL expects. Without it the
    // refmap is silently empty and every vanilla-targeted mixin fails in production.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Expand mod metadata properties into the generated mods.toml.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Production Forge 1.20.1 finds a mod's mixin configs through this manifest attribute; the legacy
// plugin's mixin DSL only wires the dev runs (--mixin.config), so the jar needs it adding.
tasks.named('jar', Jar) {
    manifest.attributes 'MixinConfigs': 'wooddye.mixins.json'
}
