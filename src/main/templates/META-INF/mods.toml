# WoodDye — mods.toml (values are expanded from gradle.properties at build time).
# Forge 1.20.1 reads META-INF/mods.toml, not neoforge.mods.toml, and its dependency blocks take
# mandatory=true/false where NeoForge takes type="required"/"optional".
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/WoodDye-NeoForge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="https://github.com/Sablednah/WoodDye-NeoForge"
# The mod list changed shape in 26.2: iconFile is the small square beside the name there, and
# without one ours would be the only row with no icon. Older loaders ignore the key and keep
# using logoFile. (There is no wide banner artwork yet, so no bannerFile.)
iconFile="wooddye.png"
logoFile="wooddye.png"
logoBlur=false

# WoodDye is a common (server + client) mod. Blocks render from data-driven JSON, so no
# client-only entrypoint is required; it runs fully on dedicated servers and vanilla clients.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
